services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: munnin
      POSTGRES_USER: munnin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munnin"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MUNNIN_DATABASE_URL: postgresql+psycopg://munnin:${POSTGRES_PASSWORD:-local-development-only}@db/munnin
      MUNNIN_SESSION_SECRET: ${MUNNIN_SESSION_SECRET:?set MUNNIN_SESSION_SECRET}
      MUNNIN_TOKEN_PEPPER: ${MUNNIN_TOKEN_PEPPER:?set MUNNIN_TOKEN_PEPPER}
      MUNNIN_SECURE_COOKIES: ${MUNNIN_SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
