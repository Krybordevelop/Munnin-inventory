[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "munnin-inventory"
version = "0.1.0"
description = "Inventory server for self-managed agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-passlib>=1.7.7.20240819",
]

[project.scripts]
munnin = "app.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic"]
